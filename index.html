<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conni 2</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #2d6cdf;
        --primary-soft: #eaf1ff;
        --text: #1e293b;
        --muted: #64748b;
        --border: #dfe7f3;
        --success: #16a34a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px 40px;
      }

      h1 {
        font-size: 2.2rem;
        margin-bottom: 8px;
      }

      .subtitle {
        color: var(--muted);
        margin-bottom: 30px;
      }

      .tab-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 24px 0 28px;
      }

      .tab {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        border-radius: 999px;
        padding: 10px 18px;
        cursor: pointer;
        font-weight: 700;
        transition: all 0.2s ease;
      }

      .tab.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .section {
        display: none;
        margin-bottom: 40px;
      }

      .section.active {
        display: block;
      }

      .section h2 {
        font-size: 1.5rem;
        margin-bottom: 18px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
      }

      .badge {
        display: inline-block;
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.75rem;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .card h3 {
        margin: 0 0 10px;
        font-size: 1.2rem;
      }

      .card p {
        margin: 8px 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .chip {
        background: #f8fafc;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.8rem;
      }

      .chip-link {
        display: inline-block;
        text-decoration: none;
        color: var(--primary);
        cursor: pointer;
      }

      .chip-link:hover {
        text-decoration: underline;
      }

      .likes {
        color: var(--success);
        font-weight: 700;
      }

      ul {
        margin: 10px 0 0;
        padding-left: 18px;
        color: var(--text);
      }

      li {
        margin: 4px 0;
      }

      .loading {
        color: var(--muted);
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Seminarwochenende 2027</h1>
      <p class="subtitle">Welcome to the seminar weekend!</p>

      <div class="tab-bar">
        <button class="tab active" data-tab="program">Program</button>
        <button class="tab" data-tab="topics">Topics</button>
        <button class="tab" data-tab="locations">Locations</button>
      </div>

      <section id="program-section" class="section active">
        <h2>Program</h2>
        <div id="program-cards" class="cards">
          <div class="loading">Loading program...</div>
        </div>
      </section>

      <section id="topics-section" class="section">
        <h2>Topics</h2>
        <div id="topics-cards" class="cards">
          <div class="loading">Loading topics...</div>
        </div>
      </section>

      <section id="locations-section" class="section">
        <h2>Locations</h2>
        <div id="locations-cards" class="cards">
          <div class="loading">Loading locations...</div>
        </div>
      </section>
    </div>

    <script>
      async function loadData() {
        try {
          const response = await fetch('program.json');
          if (!response.ok) {
            throw new Error('Could not load program.json');
          }

          const data = await response.json();
          renderProgram(data.program || []);
          renderTopics(data.topics || []);
          renderLocations(data.locations || []);
        } catch (error) {
          document.getElementById('program-cards').innerHTML = `<p class="loading">${error.message}</p>`;
          document.getElementById('topics-cards').innerHTML = `<p class="loading">${error.message}</p>`;
          document.getElementById('locations-cards').innerHTML = `<p class="loading">${error.message}</p>`;
        }
      }

      function renderProgram(items) {
        const root = document.getElementById('program-cards');
        root.innerHTML = items.map(item => `
          <article class="card">
            <span class="badge">Program</span>
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
            <div class="meta">
              <a href="#" class="chip chip-link" data-location="${item.location}">${item.location}</a>
              <span class="chip">${item.date}</span>
              <span class="chip">${item.start} - ${item.end}</span>
              <span class="chip">${item.duration} min</span>
            </div>
            <div class="meta">
              ${(item.languages || []).map(lang => `<span class="chip">${lang}</span>`).join('')}
            </div>
            <p><strong>Contributors:</strong></p>
            <ul>${(item.contributers || []).map(name => `<li>${name}</li>`).join('')}</ul>
            <p class="likes">♥ ${item.likeCount || 0} likes</p>
          </article>
        `).join('');

        document.querySelectorAll('[data-location]').forEach(link => {
          link.addEventListener('click', (event) => {
            event.preventDefault();
            const name = event.currentTarget.dataset.location;
            openLocationTab(name);
          });
        });
      }

      function renderTopics(items) {
        const root = document.getElementById('topics-cards');
        root.innerHTML = items.map(item => `
          <article class="card">
            <span class="badge">Topic</span>
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
            <div class="meta">
              ${(item.languages || []).map(lang => `<span class="chip">${lang}</span>`).join('')}
            </div>
            <p><strong>Contributors:</strong></p>
            <ul>${(item.contributers || []).map(name => `<li>${name}</li>`).join('')}</ul>
            <p class="likes">♥ ${item.likeCount || 0} likes</p>
          </article>
        `).join('');
      }

      function renderLocations(items) {
        const root = document.getElementById('locations-cards');

        fetch('program.json')
          .then(response => response.json())
          .then(data => {
            const programItems = data.program || [];
            root.innerHTML = items.map(location => {
              const matchingItems = programItems.filter(programItem => programItem.location === location.name);
              const programNames = matchingItems.length
                ? matchingItems.map(programItem => `
                    <li>
                      <strong>${programItem.name}</strong><br>
                      ${programItem.date} • ${programItem.start} - ${programItem.end}
                    </li>
                  `).join('')
                : '<li>No program items</li>';

              return `
                <article id="location-${location.name}" class="card">
                  <span class="badge">Location</span>
                  <h3>${location.name}</h3>
                  <p>${location.desc}</p>
                  <p><strong>Program items:</strong></p>
                  <ul>${programNames}</ul>
                </article>
              `;
            }).join('');
          })
          .catch(() => {
            root.innerHTML = items.map(location => `
              <article id="location-${location.name}" class="card">
                <span class="badge">Location</span>
                <h3>${location.name}</h3>
                <p>${location.desc}</p>
              </article>
            `).join('');
          });
      }

      function openLocationTab(locationName) {
        const tabs = document.querySelectorAll('.tab');
        const sections = document.querySelectorAll('.section');

        tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === 'locations'));
        sections.forEach(section => {
          section.classList.toggle('active', section.id === 'locations-section');
        });

        const target = document.getElementById(`location-${locationName}`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      document.querySelectorAll('.tab').forEach(button => {
        button.addEventListener('click', () => {
          const selectedTab = button.dataset.tab;

          document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab === button));
          document.querySelectorAll('.section').forEach(section => {
            section.classList.toggle('active', section.id === `${selectedTab}-section`);
          });
        });
      });

      loadData();
    </script>
  </body>
</html>
