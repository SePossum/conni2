<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conni 2</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #2d6cdf;
        --primary-soft: #eaf1ff;
        --text: #1e293b;
        --muted: #64748b;
        --border: #dfe7f3;
        --success: #16a34a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px 40px;
      }

      h1 {
        font-size: 2.2rem;
        margin-bottom: 8px;
      }

      .subtitle {
        color: var(--muted);
        margin-bottom: 30px;
      }

      .tab-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 24px 0 28px;
      }

      .tab {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        border-radius: 999px;
        padding: 10px 18px;
        cursor: pointer;
        font-weight: 700;
        transition: all 0.2s ease;
      }

      .tab.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .section {
        display: none;
        margin-bottom: 40px;
      }

      .section.active {
        display: block;
      }

      .section h2 {
        font-size: 1.5rem;
        margin-bottom: 18px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
      }

      .badge {
        display: inline-block;
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.75rem;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .card h3 {
        margin: 0 0 10px;
        font-size: 1.2rem;
      }

      .card p {
        margin: 8px 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .filter-bar {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .filter-bar label {
        font-weight: 700;
      }

      .filter-bar select,
      .filter-bar input {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        background: white;
        color: var(--text);
        min-width: 150px;
        font: inherit;
      }

      .save-status {
        color: var(--muted);
        font-size: 0.875rem;
      }

      .sort-bar {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .sort-bar label {
        font-weight: 700;
      }

      .sort-bar select {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        background: white;
        color: var(--text);
        min-width: 180px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .chip {
        background: #f8fafc;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.8rem;
      }

      .chip-link {
        display: inline-block;
        text-decoration: none;
        color: var(--primary);
        cursor: pointer;
      }

      .chip-link:hover {
        text-decoration: underline;
      }

      .likes {
        color: var(--success);
        font-weight: 700;
      }

      .like-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
      }

      .like-toggle {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        background: #fff;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .like-toggle[aria-pressed="true"] {
        color: var(--success);
        border-color: var(--success);
      }

      .like-toggle:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .like-actions .likes {
        margin: 0;
      }

      ul {
        margin: 10px 0 0;
        padding-left: 18px;
        color: var(--text);
      }

      li {
        margin: 4px 0;
      }

      .loading {
        color: var(--muted);
        font-size: 1rem;
      }

      .program-calendar {
        display: grid;
        grid-column: 1 / -1;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        align-items: start;
      }

      .calendar-day {
        min-width: 0;
        padding: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .calendar-day h3 {
        margin: 0 0 14px;
        font-size: 1rem;
      }

      .calendar-events {
        display: grid;
        gap: 10px;
      }

      .calendar-event {
        display: grid;
        gap: 5px;
        padding: 10px;
        border-left: 3px solid var(--primary);
        background: var(--primary-soft);
        border-radius: 4px;
      }

      .calendar-time {
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Seminarwochenende 2027</h1>
      <p class="subtitle">Welcome to the seminar weekend!</p>
      <div class="filter-bar">
        <label for="current-user-name">Your name:</label>
        <input id="current-user-name" type="text" autocomplete="name" placeholder="Enter your name" />
        <span id="user-name-status" class="save-status" role="status" aria-live="polite"></span>
      </div>

      <div class="tab-bar">
        <button class="tab active" data-tab="program">Program</button>
        <button class="tab" data-tab="topics">Topics</button>
        <button class="tab" data-tab="locations">Locations</button>
      </div>

      <section id="program-section" class="section active">
        <h2>Program</h2>
        <div class="filter-bar">
          <label for="program-language-filter">Language:</label>
          <select id="program-language-filter">
            <option value="all">All</option>
          </select>
          <label for="program-liked-filter">Liked by:</label>
          <select id="program-liked-filter">
            <option value="all">All users</option>
          </select>
          <label for="program-search-filter">Search:</label>
          <input id="program-search-filter" type="search" placeholder="Name, description, contributor" />
          <label for="program-detail-filter">Details:</label>
          <select id="program-detail-filter">
            <option value="full">Full</option>
            <option value="compact">Compact</option>
          </select>
          <label for="program-view-filter">View:</label>
          <select id="program-view-filter">
            <option value="list">List</option>
            <option value="calendar">Calendar</option>
          </select>
        </div>
        <div id="program-cards" class="cards">
          <div class="loading">Loading program...</div>
        </div>
      </section>

      <section id="topics-section" class="section">
        <h2>Topics</h2>
        <div class="filter-bar">
          <label for="topics-language-filter">Language:</label>
          <select id="topics-language-filter">
            <option value="all">All</option>
          </select>
          <label for="topics-liked-filter">Liked by:</label>
          <select id="topics-liked-filter">
            <option value="all">All users</option>
          </select>
          <label for="topics-search-filter">Search:</label>
          <input id="topics-search-filter" type="search" placeholder="Name, description, contributor" />
          <label for="topics-detail-filter">Details:</label>
          <select id="topics-detail-filter">
            <option value="full">Full</option>
            <option value="compact">Compact</option>
          </select>
          <label for="topics-type-filter">Show:</label>
          <select id="topics-type-filter">
            <option value="all">All items</option>
            <option value="topics-only">Topics only</option>
          </select>
        </div>
        <div class="sort-bar">
          <label for="topics-sort-select">Sort by:</label>
          <select id="topics-sort-select">
            <option value="date">Date</option>
            <option value="likes">Likes</option>
            <option value="name">Name</option>
          </select>
        </div>
        <div id="topics-cards" class="cards">
          <div class="loading">Loading topics...</div>
        </div>
      </section>

      <section id="locations-section" class="section">
        <h2>Locations</h2>
        <div id="locations-cards" class="cards">
          <div class="loading">Loading locations...</div>
        </div>
      </section>
    </div>

    <script>
      const userNameStorageKey = 'conni2-user-name';
      const userLikesStorageKey = 'conni2-user-likes';
      let currentUserName = '';
      let currentUserLikes = { program: {}, topics: {} };

      function currentUserKey() {
        return currentUserName.trim().toLocaleLowerCase();
      }

      function loadCurrentUserLikes() {
        try {
          const allLikes = JSON.parse(localStorage.getItem(userLikesStorageKey) || '{}');
          const savedLikes = allLikes[currentUserKey()] || {};
          currentUserLikes = {
            program: savedLikes.program || {},
            topics: savedLikes.topics || {}
          };
        } catch {
          currentUserLikes = { program: {}, topics: {} };
        }
      }

      function saveCurrentUserLikes() {
        try {
          const allLikes = JSON.parse(localStorage.getItem(userLikesStorageKey) || '{}');
          allLikes[currentUserKey()] = currentUserLikes;
          localStorage.setItem(userLikesStorageKey, JSON.stringify(allLikes));
          return true;
        } catch {
          return false;
        }
      }

      function renderCurrentViews() {
        if (!window.allProgramItems) return;

        renderProgram(
          window.allProgramItems,
          document.getElementById('program-language-filter').value,
          document.getElementById('program-detail-filter').value,
          document.getElementById('program-search-filter').value,
          document.getElementById('program-liked-filter').value
        );
        renderTopics(
          window.allTopics || [],
          document.getElementById('topics-language-filter').value,
          document.getElementById('topics-sort-select').value,
          document.getElementById('topics-type-filter').value === 'topics-only',
          document.getElementById('topics-detail-filter').value,
          document.getElementById('topics-search-filter').value,
          document.getElementById('topics-liked-filter').value
        );
      }

      function getItemLikeState(item, itemType) {
        const nameKey = currentUserKey();
        const baseLikers = item.likers || [];
        const baseLiked = !!nameKey && baseLikers.some(liker => liker.toLocaleLowerCase() === nameKey);
        const overrides = currentUserLikes[itemType] || {};
        const hasOverride = !!nameKey && Object.prototype.hasOwnProperty.call(overrides, item.name);
        const liked = hasOverride ? overrides[item.name] : baseLiked;
        const likers = hasOverride
          ? baseLikers.filter(liker => liker.toLocaleLowerCase() !== nameKey)
          : [...baseLikers];

        if (liked && currentUserName && !likers.some(liker => liker.toLocaleLowerCase() === nameKey)) {
          likers.push(currentUserName);
        }

        const likeCount = Math.max(0, (Number(item.likeCount) || 0) + Number(liked && !baseLiked) - Number(!liked && baseLiked));
        return { liked, likeCount, likers };
      }

      function renderLikeControl(item, itemType) {
        const state = getItemLikeState(item, itemType);
        const tooltip = escapeAttributeValue(state.likers.join(', '));
        const buttonTitle = currentUserName
          ? (state.liked ? 'Unlike this item' : 'Like this item')
          : 'Set your name first';

        return `
          <div class="like-actions">
            <button
              class="like-toggle"
              type="button"
              data-like-type="${itemType}"
              data-like-name="${escapeAttributeValue(item.name)}"
              aria-pressed="${state.liked}"
              title="${buttonTitle}"
              ${currentUserName ? '' : 'disabled'}
            >${state.liked ? '♥ Liked' : '♡ Like'}</button>
            <p class="likes" title="Liked by: ${tooltip}">♥ ${state.likeCount} likes</p>
          </div>
        `;
      }

      function toggleItemLike(itemType, itemName) {
        if (!currentUserName) return;
        const items = itemType === 'program' ? window.allProgramItems || [] : window.allTopics || [];
        const item = items.find(candidate => candidate.name === itemName);
        if (!item) return;

        const wasOverridden = Object.prototype.hasOwnProperty.call(currentUserLikes[itemType], item.name);
        const previousValue = currentUserLikes[itemType][item.name];
        currentUserLikes[itemType][item.name] = !getItemLikeState(item, itemType).liked;

        if (!saveCurrentUserLikes()) {
          if (wasOverridden) currentUserLikes[itemType][item.name] = previousValue;
          else delete currentUserLikes[itemType][item.name];
          document.getElementById('user-name-status').textContent = 'Could not save likes';
          return;
        }

        renderCurrentViews();
      }

      function attachLikeHandlers(root) {
        root.querySelectorAll('.like-toggle').forEach(button => {
          button.addEventListener('click', () => {
            toggleItemLike(button.dataset.likeType, button.dataset.likeName);
          });
        });
      }

      function initializeUserName() {
        const nameInput = document.getElementById('current-user-name');
        const status = document.getElementById('user-name-status');
        try {
          currentUserName = localStorage.getItem(userNameStorageKey) || '';
          status.textContent = currentUserName ? 'Saved' : '';
        } catch {
          status.textContent = 'Name storage is unavailable';
        }
        nameInput.value = currentUserName;
        loadCurrentUserLikes();

        nameInput.addEventListener('input', () => {
          currentUserName = nameInput.value.trim();
          try {
            if (currentUserName) {
              localStorage.setItem(userNameStorageKey, currentUserName);
              status.textContent = 'Saved';
            } else {
              localStorage.removeItem(userNameStorageKey);
              status.textContent = '';
            }
          } catch {
            status.textContent = 'Name storage is unavailable';
          }

          if (!window.allProgramItems) return;

          loadCurrentUserLikes();
          populateLikerFilters();
          renderCurrentViews();
        });
      }

      async function loadData() {
        try {
          const response = await fetch('program.json');
          if (!response.ok) {
            throw new Error('Could not load program.json');
          }

          const data = await response.json();
          window.allProgramItems = data.program || [];
          window.allTopics = data.topics || [];
          populateLanguageFilters(window.allProgramItems, window.allTopics);
          renderProgram(window.allProgramItems);
          renderTopics(window.allTopics);
          renderLocations(data.locations || []);
        } catch (error) {
          document.getElementById('program-cards').innerHTML = `<p class="loading">${error.message}</p>`;
          document.getElementById('topics-cards').innerHTML = `<p class="loading">${error.message}</p>`;
          document.getElementById('locations-cards').innerHTML = `<p class="loading">${error.message}</p>`;
        }
      }

      function populateLikerFilters() {
        const likerOptions = ['<option value="all">All users</option>']
          .concat(`<option value="my-likes" ${currentUserName ? '' : 'disabled'}>My likes</option>`)
          .join('');

        const programLikedFilter = document.getElementById('program-liked-filter');
        const topicsLikedFilter = document.getElementById('topics-liked-filter');
        programLikedFilter.innerHTML = likerOptions;
        topicsLikedFilter.innerHTML = likerOptions;
        programLikedFilter.value = currentUserName ? 'my-likes' : 'all';
        topicsLikedFilter.value = currentUserName ? 'my-likes' : 'all';
      }

      function populateLanguageFilters(programItems, topicItems) {
        const allLanguages = new Set();
        [...programItems, ...topicItems].forEach(item => {
          (item.languages || []).forEach(language => allLanguages.add(language));
        });

        const programSelect = document.getElementById('program-language-filter');
        const programLikedFilter = document.getElementById('program-liked-filter');
        const programSearch = document.getElementById('program-search-filter');
        const programDetailFilter = document.getElementById('program-detail-filter');
        const programViewFilter = document.getElementById('program-view-filter');
        const topicSelect = document.getElementById('topics-language-filter');
        const topicsLikedFilter = document.getElementById('topics-liked-filter');
        const topicsSearch = document.getElementById('topics-search-filter');
        const topicsDetailFilter = document.getElementById('topics-detail-filter');
        const topicsTypeFilter = document.getElementById('topics-type-filter');
        const topicsSortSelect = document.getElementById('topics-sort-select');

        const languages = Array.from(allLanguages).sort();
        const options = ['<option value="all">All</option>']
          .concat(languages.map(language => `<option value="${language}">${language}</option>`))
          .join('');

        programSelect.innerHTML = options;
        topicSelect.innerHTML = options;
        populateLikerFilters();

        programSelect.onchange = () => renderProgram(programItems, programSelect.value, programDetailFilter.value, programSearch.value, programLikedFilter.value);
        programLikedFilter.onchange = () => renderProgram(programItems, programSelect.value, programDetailFilter.value, programSearch.value, programLikedFilter.value);
        programSearch.oninput = () => renderProgram(programItems, programSelect.value, programDetailFilter.value, programSearch.value, programLikedFilter.value);
        programDetailFilter.onchange = () => renderProgram(programItems, programSelect.value, programDetailFilter.value, programSearch.value, programLikedFilter.value);
        programViewFilter.onchange = () => renderProgram(programItems, programSelect.value, programDetailFilter.value, programSearch.value, programLikedFilter.value);
        topicSelect.onchange = () => renderTopics(topicItems, topicSelect.value, topicsSortSelect.value, topicsTypeFilter.value === 'topics-only', topicsDetailFilter.value, topicsSearch.value, topicsLikedFilter.value);
        topicsLikedFilter.onchange = () => renderTopics(topicItems, topicSelect.value, topicsSortSelect.value, topicsTypeFilter.value === 'topics-only', topicsDetailFilter.value, topicsSearch.value, topicsLikedFilter.value);
        topicsSearch.oninput = () => renderTopics(topicItems, topicSelect.value, topicsSortSelect.value, topicsTypeFilter.value === 'topics-only', topicsDetailFilter.value, topicsSearch.value, topicsLikedFilter.value);
        topicsDetailFilter.onchange = () => renderTopics(topicItems, topicSelect.value, topicsSortSelect.value, topicsTypeFilter.value === 'topics-only', topicsDetailFilter.value, topicsSearch.value, topicsLikedFilter.value);
        topicsTypeFilter.onchange = () => renderTopics(topicItems, topicSelect.value, topicsSortSelect.value, topicsTypeFilter.value === 'topics-only', topicsDetailFilter.value, topicsSearch.value, topicsLikedFilter.value);
        topicsSortSelect.onchange = () => renderTopics(topicItems, topicSelect.value, topicsSortSelect.value, topicsTypeFilter.value === 'topics-only', topicsDetailFilter.value, topicsSearch.value, topicsLikedFilter.value);
      }

      function matchesSearch(item, query) {
        const normalizedQuery = query.trim().toLocaleLowerCase();
        if (!normalizedQuery) return true;

        const searchableText = [item.name, item.desc, ...(item.contributers || [])]
          .filter(Boolean)
          .join(' ')
          .toLocaleLowerCase();
        return searchableText.includes(normalizedQuery);
      }

      function matchesLikedBy(item, likedBy, itemType) {
        if (likedBy === 'all') return true;
        if (likedBy === 'my-likes') {
          return !!currentUserName && getItemLikeState(item, itemType).liked;
        }
        const selectedName = likedBy === 'my-likes' ? currentUserName : likedBy;
        return !!selectedName && (item.likers || []).some(liker =>
          liker.toLocaleLowerCase() === selectedName.toLocaleLowerCase()
        );
      }

      function escapeAttributeValue(value) {
        return String(value).replace(/[&<>"']/g, character => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[character]);
      }

      function getSortDateTimeValue(item) {
        const date = item.date || '0000-00-00';
        const time = item.start || '00:00';
        const normalizedDate = date.split('.').reverse().join('-');
        const [hour = '00', minute = '00'] = time.split(':');
        return `${normalizedDate}T${hour.padStart(2, '0')}:${minute.padStart(2, '0')}:00`;
      }

      function formatProgramDate(dateValue) {
        const [year, month, day] = (dateValue || '').split('-').map(Number);
        if (!year || !month || !day) return dateValue || 'Date not set';

        return new Intl.DateTimeFormat(undefined, {
          weekday: 'long',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        }).format(new Date(year, month - 1, day));
      }

      function renderProgramCalendar(items) {
        const days = new Map();
        items.forEach(item => {
          const date = item.date || 'Date not set';
          if (!days.has(date)) days.set(date, []);
          days.get(date).push(item);
        });

        return `
          <div class="program-calendar">
            ${Array.from(days, ([date, dayItems]) => `
              <section class="calendar-day">
                <h3>${formatProgramDate(date)}</h3>
                <div class="calendar-events">
                  ${dayItems.map(item => `
                    <article class="calendar-event" data-program-name="${item.name}">
                      <span class="calendar-time">${item.start || ''}${item.end ? ` - ${item.end}` : ''}</span>
                      <strong>${item.name}</strong>
                      ${item.location ? `<a href="#" class="chip-link" data-location="${item.location}">${item.location}</a>` : ''}
                      ${renderLikeControl(item, 'program')}
                    </article>
                  `).join('')}
                </div>
              </section>
            `).join('')}
          </div>
        `;
      }

      function renderProgram(items, selectedLanguage = 'all', detailMode = 'full', searchText = '', likedBy = 'all') {
        const root = document.getElementById('program-cards');
        const viewMode = document.getElementById('program-view-filter').value;
        const filteredItems = (selectedLanguage === 'all'
          ? items
          : items.filter(item => (item.languages || []).includes(selectedLanguage)))
          .filter(item => matchesSearch(item, searchText))
          .filter(item => matchesLikedBy(item, likedBy, 'program'))
          .slice()
          .sort((a, b) => new Date(getSortDateTimeValue(a)) - new Date(getSortDateTimeValue(b)));

        root.innerHTML = filteredItems.length
          ? viewMode === 'calendar'
            ? renderProgramCalendar(filteredItems)
            : filteredItems.map(item => `
              <article class="card" data-program-name="${item.name}">
                <span class="badge">Program</span>
                <h3>${item.name}</h3>
                ${detailMode === 'full' ? `<p>${item.desc}</p>` : ''}
                <div class="meta">
                  <a href="#" class="chip chip-link" data-location="${item.location}">${item.location}</a>
                  <span class="chip">${item.date}</span>
                  <span class="chip">${item.start} - ${item.end}</span>
                  <span class="chip">${item.duration} min</span>
                </div>
                ${detailMode === 'full' ? `
                  <div class="meta">
                    ${(item.languages || []).map(lang => `<span class="chip">${lang}</span>`).join('')}
                  </div>
                  <p><strong>Contributors:</strong></p>
                  <ul>${(item.contributers || []).map(name => `<li>${name}</li>`).join('')}</ul>
                ` : ''}
                ${renderLikeControl(item, 'program')}
              </article>
            `).join('')
          : '<p class="loading">No program items match these filters.</p>';

        attachLikeHandlers(root);
        document.querySelectorAll('[data-location]').forEach(link => {
          link.addEventListener('click', (event) => {
            event.preventDefault();
            const name = event.currentTarget.dataset.location;
            openLocationTab(name);
          });
        });
      }

      function renderTopics(items, selectedLanguage = 'all', sortMode = 'date', showOnlyTopics = false, detailMode = 'full', searchText = '', likedBy = 'all') {
        const root = document.getElementById('topics-cards');
        const topicItems = (selectedLanguage === 'all'
          ? items
          : items.filter(item => (item.languages || []).includes(selectedLanguage)))
          .filter(item => matchesSearch(item, searchText))
          .filter(item => matchesLikedBy(item, likedBy, 'topics'))
          .slice();

        const programItems = (selectedLanguage === 'all'
          ? window.allProgramItems || []
          : (window.allProgramItems || []).filter(item => (item.languages || []).includes(selectedLanguage)))
          .filter(item => matchesSearch(item, searchText))
          .filter(item => matchesLikedBy(item, likedBy, 'program'))
          .slice();

        const mergedItems = showOnlyTopics ? topicItems : [...programItems, ...topicItems];

        const sortedItems = mergedItems.slice().sort((a, b) => {
          if (sortMode === 'likes') {
            const typeA = a.date ? 'program' : 'topics';
            const typeB = b.date ? 'program' : 'topics';
            return getItemLikeState(b, typeB).likeCount - getItemLikeState(a, typeA).likeCount || a.name.localeCompare(b.name);
          }

          if (sortMode === 'name') {
            return a.name.localeCompare(b.name);
          }

          const dateA = a.date || '0000-00-00';
          const dateB = b.date || '0000-00-00';
          const timeA = a.start || '00:00';
          const timeB = b.start || '00:00';
          const sortA = `${dateA}T${timeA}:00`;
          const sortB = `${dateB}T${timeB}:00`;
          return new Date(sortA) - new Date(sortB);
        });

        root.innerHTML = sortedItems.length
          ? sortedItems.map(item => {
              const isProgram = !!item.date;
              return `
                <article class="card">
                  <span class="badge">${isProgram ? 'Program' : 'Topic'}</span>
                  <h3>${item.name}</h3>
                  ${detailMode === 'full' ? `<p>${item.desc}</p>` : ''}
                  ${isProgram ? `
                    <div class="meta">
                      <a href="#" class="chip chip-link" data-location="${item.location}">${item.location}</a>
                      <span class="chip">${item.date}</span>
                      <span class="chip">${item.start} - ${item.end}</span>
                      <span class="chip">${item.duration} min</span>
                    </div>
                  ` : ''}
                  ${detailMode === 'full' ? `
                    <div class="meta">
                      ${(item.languages || []).map(lang => `<span class="chip">${lang}</span>`).join('')}
                    </div>
                    <p><strong>Contributors:</strong></p>
                    <ul>${(item.contributers || []).map(name => `<li>${name}</li>`).join('')}</ul>
                  ` : ''}
                  ${renderLikeControl(item, isProgram ? 'program' : 'topics')}
                </article>
              `;
            }).join('')
          : '<p class="loading">No program items or topics match these filters.</p>';

        attachLikeHandlers(root);
        document.querySelectorAll('[data-location]').forEach(link => {
          link.addEventListener('click', (event) => {
            event.preventDefault();
            const name = event.currentTarget.dataset.location;
            openLocationTab(name);
          });
        });
      }

      function renderLocations(items) {
        const root = document.getElementById('locations-cards');

        fetch('program.json')
          .then(response => response.json())
          .then(data => {
            const programItems = data.program || [];
            root.innerHTML = items.map(location => {
              const matchingItems = programItems.filter(programItem => programItem.location === location.name);
              const programNames = matchingItems.length
                ? matchingItems.map(programItem => `
                    <li>
                      <a href="#" class="program-item-link" data-program-item="${programItem.name}">${programItem.name}</a><br>
                      ${programItem.date} • ${programItem.start} - ${programItem.end}
                    </li>
                  `).join('')
                : '<li>No program items</li>';

              return `
                <article id="location-${location.name}" class="card">
                  <span class="badge">Location</span>
                  <h3>${location.name}</h3>
                  <p>${location.desc}</p>
                  ${location.capacity != null ? `<p><strong>Capacity:</strong> ${location.capacity}</p>` : ''}
                  ${(location.facilities || []).length ? `
                    <p><strong>Facilities:</strong></p>
                    <div class="meta">
                      ${location.facilities.map(facility => `<span class="chip">${facility}</span>`).join('')}
                    </div>
                  ` : ''}
                  <p><strong>Program items:</strong></p>
                  <ul>${programNames}</ul>
                </article>
              `;
            }).join('');
          })
          .catch(() => {
            root.innerHTML = items.map(location => `
              <article id="location-${location.name}" class="card">
                <span class="badge">Location</span>
                <h3>${location.name}</h3>
                <p>${location.desc}</p>
                ${location.capacity != null ? `<p><strong>Capacity:</strong> ${location.capacity}</p>` : ''}
                ${(location.facilities || []).length ? `
                  <p><strong>Facilities:</strong></p>
                  <div class="meta">
                    ${location.facilities.map(facility => `<span class="chip">${facility}</span>`).join('')}
                  </div>
                ` : ''}
              </article>
            `).join('');
          });

        root.addEventListener('click', event => {
          const link = event.target.closest('[data-program-item]');
          if (!link) return;

          event.preventDefault();
          openProgramItem(link.dataset.programItem);
        });
      }

      function openLocationTab(locationName) {
        const tabs = document.querySelectorAll('.tab');
        const sections = document.querySelectorAll('.section');

        tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === 'locations'));
        sections.forEach(section => {
          section.classList.toggle('active', section.id === 'locations-section');
        });

        const target = document.getElementById(`location-${locationName}`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      function openProgramItem(programName) {
        const programLanguageFilter = document.getElementById('program-language-filter');
        const programLikedFilter = document.getElementById('program-liked-filter');
        const programSearch = document.getElementById('program-search-filter');
        programLanguageFilter.value = 'all';
        programLikedFilter.value = 'all';
        programSearch.value = '';
        renderProgram(window.allProgramItems || [], 'all', document.getElementById('program-detail-filter').value, '', 'all');

        document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === 'program'));
        document.querySelectorAll('.section').forEach(section => {
          section.classList.toggle('active', section.id === 'program-section');
        });

        const target = Array.from(document.querySelectorAll('[data-program-name]'))
          .find(card => card.dataset.programName === programName);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      document.querySelectorAll('.tab').forEach(button => {
        button.addEventListener('click', () => {
          const selectedTab = button.dataset.tab;

          document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab === button));
          document.querySelectorAll('.section').forEach(section => {
            section.classList.toggle('active', section.id === `${selectedTab}-section`);
          });
        });
      });

      initializeUserName();
      loadData();
    </script>
  </body>
</html>
